[project]
name = "visual-studio"
version = "0.1.0"
description = "Image Studio stage 1: generation, editing, composition, QC and export of ad creatives over cloud providers (fal.ai)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
