<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>product-card</title>
<style>
  /* Generic marketplace product-card infographic, project kworks. Same
     contract as banner.html: {{background}} {{logo}} + data-driven extras
     {{accent}} {{badge}} {{headline}} {{usp}} {{specN_value/label}}.
     Rendered by scripts/compose.py at 4x5 (main) and 1x1 (search crop);
     the product is baked into the background image, text lives top and
     bottom over scrims. No JS, system fonts only. */
  :root {
    --safe-inset: 4%;                   /* marketplace UI overlays corners */
    --accent: {{accent}};
    --scrim-top: {{scrim_top}};         /* peak gradient alpha */
    --scrim-bottom: {{scrim_bottom}};
    --panel: rgba(16, 18, 22, 0.78);
    --ink: #ffffff;
    --ink-dim: #cdd1d8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101215;
    font-family: system-ui, "DejaVu Sans", sans-serif;
  }

  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  .background {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* readability gradients behind the text blocks; product stays visible
     in the uncovered middle */
  .scrim-top {
    position: absolute; left: 0; right: 0; top: 0; height: 44%;
    background: linear-gradient(180deg,
      rgba(8, 9, 12, var(--scrim-top)) 0%,
      rgba(8, 9, 12, calc(var(--scrim-top) * 0.5)) 58%, rgba(8, 9, 12, 0) 100%);
  }
  .scrim-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(0deg,
      rgba(8, 9, 12, var(--scrim-bottom)) 0%,
      rgba(8, 9, 12, calc(var(--scrim-bottom) * 0.5)) 66%, rgba(8, 9, 12, 0) 100%);
  }

  .safe {
    position: absolute; inset: var(--safe-inset);
    display: flex; flex-direction: column; gap: 1.6vh;
  }

  .badge {
    align-self: flex-start;
    background: #ffffff; color: #15161a;
    border-radius: 999px;
    padding: 1vh 2.4vw;
    font-size: 2.6vw; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em;
    box-shadow: 0 0.5vh 1.4vh rgba(0, 0, 0, 0.35);
  }

  .headline {
    color: var(--ink);
    font-size: 6vw;
    font-weight: 800;
    line-height: 1.08;
    text-transform: uppercase;
    letter-spacing: 0.005em;
    max-width: 95%;
    text-shadow: 0 0.4vh 1vh rgba(0, 0, 0, 0.6), 0 0 2.4vh rgba(0, 0, 0, 0.35);
  }

  .hero { flex: 1; min-height: 0; }     /* breathing room for the product */

  .usp {
    align-self: flex-start;
    background: var(--accent); color: #17181c;
    font-size: 3.4vw; font-weight: 800;
    text-transform: uppercase; line-height: 1.05;
    padding: 1.2vh 2.6vw; border-radius: 1.2vh;
    letter-spacing: 0.01em;
    box-shadow: 0 0.6vh 1.8vh rgba(0, 0, 0, 0.4);
  }

  .specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vw; }
  .spec {
    background: var(--panel);
    border-radius: 1.6vh; border-top: 0.6vh solid var(--accent);
    padding: 1.3vh 1vw 1.2vh;
    text-align: center;
    box-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.35);
  }
  .spec .value {
    display: block; color: var(--ink);
    font-size: 4.4vw; font-weight: 800; line-height: 1.05;
    white-space: nowrap;
  }
  .spec .label {
    display: block; color: var(--ink-dim);
    font-size: 2.2vw; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-top: 0.6vh;
  }
  /* Square render (1080x1080): less vertical room -> tighter type */
  @media (max-height: 1200px) {
    .badge { font-size: 2.8vw; }
    .headline { font-size: 6.4vw; }
    .usp { font-size: 3.6vw; }
    .spec .value { font-size: 4.6vw; }
    .spec .label { font-size: 2.4vw; }
  }

  .badge:empty, .headline:empty, .usp:empty { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <img class="background" src="{{background}}" alt="">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="safe">
      <div class="badge">{{badge}}</div>
      <h1 class="headline">{{headline}}</h1>
      <div class="hero"></div>
      <div class="usp">{{usp}}</div>
      <div class="specs">
        <div class="spec">
          <span class="value">{{spec1_value}}</span>
          <span class="label">{{spec1_label}}</span>
        </div>
        <div class="spec">
          <span class="value">{{spec2_value}}</span>
          <span class="label">{{spec2_label}}</span>
        </div>
        <div class="spec">
          <span class="value">{{spec3_value}}</span>
          <span class="label">{{spec3_label}}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
